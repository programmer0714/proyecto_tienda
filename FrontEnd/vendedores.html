<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Mantenimiento de Vendedores</title>

  <!-- Nunito Font -->
  <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet">
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
  <!-- Bootstrap 4 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- SB Admin 2 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/startbootstrap-sb-admin-2/4.1.4/css/sb-admin-2.min.css" rel="stylesheet">
  <!-- DataTables -->
  <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap4.min.css" rel="stylesheet">
  <!-- Estilos propios -->
  <link href="/src/style.css" rel="stylesheet">
</head>

<body id="page-top">

  <div id="wrapper">

    <!-- ── SIDEBAR ─────────────────────────────────────── -->
    <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">

      <a class="sidebar-brand d-flex align-items-center justify-content-center" href="index.html">
        <div class="sidebar-brand-icon">
          <i class="fas fa-store"></i>
        </div>
        <div class="sidebar-brand-text mx-3">MI TIENDA</div>
      </a>
      <hr class="sidebar-divider my-0">

      <li class="nav-item">
        <a class="nav-link" href="index.html">
          <i class="fas fa-fw fa-tachometer-alt"></i>
          <span>Dashboard</span>
        </a>
      </li>
      <hr class="sidebar-divider">

      <div class="sidebar-heading">Mantenimiento</div>

      <li class="nav-item">
        <a class="nav-link" href="index.html">
          <i class="fas fa-fw fa-map-marker-alt"></i>
          <span>Distritos</span>
        </a>
      </li>

      <li class="nav-item active">
        <a class="nav-link" href="vendedores.html">
          <i class="fas fa-fw fa-users"></i>
          <span>Vendedores</span>
        </a>
      </li>

      <hr class="sidebar-divider d-none d-md-block">
      <div class="text-center d-none d-md-inline">
        <button class="rounded-circle border-0" id="sidebarToggle"></button>
      </div>
    </ul>
    <!-- ── FIN SIDEBAR ───────────────────────────────── -->

    <div id="content-wrapper" class="d-flex flex-column">
      <div id="content">

        <!-- ── TOPBAR ──────────────────────────────────── -->
        <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
          <button id="sidebarToggleTop" class="btn btn-link d-md-none rounded-circle mr-3">
            <i class="fa fa-bars"></i>
          </button>
          <span class="navbar-brand font-weight-bold text-primary">
            <i class="fas fa-users mr-2"></i>Mantenimiento de Vendedores
          </span>
        </nav>
        <!-- ── FIN TOPBAR ──────────────────────────────── -->

        <!-- ── CONTENIDO PRINCIPAL ────────────────────── -->
        <div class="container-fluid">

          <div class="d-sm-flex align-items-center justify-content-between mb-4">
            <h1 class="h3 mb-0 text-gray-800">Vendedores</h1>
            <ol class="breadcrumb mb-0 bg-transparent">
              <li class="breadcrumb-item"><a href="#">Inicio</a></li>
              <li class="breadcrumb-item active">Vendedores</li>
            </ol>
          </div>

          <div class="card shadow mb-4">
            <div class="card-header py-3 d-flex align-items-center justify-content-between">
              <h6 class="m-0 font-weight-bold text-primary">
                <i class="fas fa-list mr-1"></i> Lista de Vendedores
              </h6>
              <span id="totalRegistros" class="badge badge-primary badge-pill"></span>
            </div>
            <div class="card-body">
              <!-- Spinner -->
              <div id="spinner" class="text-center py-4">
                <div class="spinner-border text-primary" role="status">
                  <span class="sr-only">Cargando...</span>
                </div>
                <p class="mt-2 text-muted">Cargando datos...</p>
              </div>

              <!-- Tabla -->
              <div id="tablaContainer" style="display:none">
                <div class="table-responsive">
                  <table id="tablaVendedores" class="table table-bordered table-hover table-sm" width="100%">
                    <thead class="thead-dark">
                      <tr>
                        <th class="text-center" style="width:60px">ID</th>
                        <th>Nombres</th>
                        <th>Apellidos</th>
                        <th>Correo</th>
                        <th>Distrito</th>
                      </tr>
                    </thead>
                    <tbody id="cuerpoTabla">
                      <!-- Filas generadas por vendedores.js -->
                    </tbody>
                  </table>
                </div>
              </div>

              <!-- Error -->
              <div id="errorMsg" class="alert alert-danger d-none" role="alert">
                <i class="fas fa-exclamation-triangle mr-2"></i>
                <span id="errorText"></span>
              </div>
            </div>
          </div>

        </div>
        <!-- ── FIN CONTENIDO ───────────────────────────── -->

      </div>

      <footer class="sticky-footer bg-white">
        <div class="container my-auto">
          <div class="copyright text-center my-auto">
            <span>SENATI &copy; 2025 — Ingeniería de Software con IA</span>
          </div>
        </div>
      </footer>
    </div>
  </div>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Bootstrap 4 Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- SB Admin 2 JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/startbootstrap-sb-admin-2/4.1.4/js/sb-admin-2.min.js"></script>
  <!-- DataTables -->
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap4.min.js"></script>

  <!-- Lógica de la página -->
  <script type="module" src="/src/vendedores.js"></script>

</body>
</html>
